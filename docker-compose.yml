# One command for the whole stack:
#   docker compose up -d --build
# brings up mysql, backend, phpMyAdmin, and frontend together.
#
name: cpareviewer
services:
  mysql:
    image: mysql:8.4
    container_name: cpa-reviewer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cpa_reviewer
      MYSQL_USER: cpa_reviewer
      MYSQL_PASSWORD: cpa_reviewer
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10

  # The Express API, containerized so it can be stopped/started with
  # `docker compose` instead of managing background `npm run dev` processes
  # by hand (the EADDRINUSE-on-8001 headache that motivated this).
  # Connects to the `mysql` service on this compose network (always local
  # dev DB, not whatever backend/.env's DB_HOST currently points the
  # host-run `npm run dev` at) — JWT/EmailJS/OTP-bypass vars still come from
  # backend/.env via the usual ${VAR} substitution.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpa-reviewer-backend
    restart: unless-stopped
    environment:
      PORT: 8001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: cpa_reviewer
      DB_PASSWORD: cpa_reviewer
      DB_NAME: cpa_reviewer
      # Explicitly blanked: the container bind-mounts this whole directory
      # (including .env) for hot reload, and dotenv only fills in vars NOT
      # already set here — without this, it'd inherit .env's host-only CA
      # cert path (meant for the host-run `npm run dev` talking to Aiven)
      # and crash trying to read a path that doesn't exist in the container.
      DB_SSL_CA_PATH: ''
      DB_SSL_CA: ''
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID:-}
      EMAILJS_TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID:-}
      EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY:-}
      EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY:-}
      OTP_BYPASS_EMAILS: ${OTP_BYPASS_EMAILS:-}
    ports:
      - '8001:8001'
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  # The Vite dev server, containerized for the same reason as `backend`.
  # Runs client-side in the browser, so it still talks to the backend via
  # `VITE_API_BASE_URL` from frontend/.env (defaults to
  # http://localhost:8001) — the published host port above, not the
  # in-network `backend` service name.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cpa-reviewer-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  phpmyadmin:
    image: phpmyadmin:5
    container_name: cpa-reviewer-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: cpa_reviewer
      PMA_PASSWORD: cpa_reviewer
      # Read by config.user.inc.php below to add Aiven Production as a
      # second server choice — see backend/.env.example for what to set.
      AIVEN_DB_HOST: ${AIVEN_DB_HOST:-}
      AIVEN_DB_PORT: ${AIVEN_DB_PORT:-}
    ports:
      - '8081:80'
    volumes:
      - ./backend/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
      - ${AIVEN_DB_SSL_CA_PATH:-./backend/config.user.inc.php}:/etc/phpmyadmin/aiven-ca.pem:ro
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
